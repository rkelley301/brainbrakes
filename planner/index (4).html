<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Next Steps Planner</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Inter font stack via system fallback chain, no external font file */
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* Shared focus token: visible on keyboard nav only, matches indigo brand accent (WCAG 2.4.7) */
  .focus-ring:focus-visible {
    outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.35); border-color: #4f46e5;
  }

  @keyframes riseIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .stagger-in { animation: riseIn 0.35s ease forwards; opacity: 0; }

  /* Custom checkbox: 24px rounded square with hover/press feedback + explicit focus-visible ring (fixes P0 gap) */
  .task-check {
    width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0;
    border: 2px solid #a5b4fc; background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 150ms ease, border-color 150ms ease, transform 120ms ease, box-shadow 150ms ease;
  }
  .task-check:hover { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129,140,248,0.15); transform: scale(1.08); }
  .task-check:active { transform: scale(0.92); }
  .task-check:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.4); }
  .task-check.checked { background: #4f46e5; border-color: #4f46e5; }
  .task-check.checked:hover { box-shadow: 0 0 0 4px rgba(79,70,229,0.2); }
  .task-check svg { width: 14px; height: 14px; opacity: 0; transform: scale(0.5); transition: opacity 120ms ease, transform 180ms cubic-bezier(.34,1.56,.64,1); }
  .task-check.checked svg { opacity: 1; transform: scale(1); }

  @keyframes dotPulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .dot { animation: dotPulse 1.4s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  .card-hover { transition: box-shadow 200ms ease; }
  .card-hover:hover { box-shadow: 0 4px 14px -2px rgba(15,23,42,0.12); }
</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">

  <main class="max-w-[640px] mx-auto px-6 py-16">

    <header class="mb-8 text-center">
      <h1 class="text-[30px] font-bold tracking-tight leading-tight">Turn a goal into a plan</h1>
      <p class="mt-2 text-base text-slate-600">Three concrete moves. No fluff, no forms.</p>
    </header>

    <!-- INPUT ZONE: distinct workspace surface -->
    <section class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-7 shadow-sm">
      <form id="goal-form" novalidate>
        <label for="goal-input" class="block text-[12px] font-semibold uppercase tracking-[0.05em] text-slate-500 mb-2">
          Your goal
        </label>
        <input
          id="goal-input"
          name="goal"
          type="text"
          placeholder="What do you want to accomplish?"
          class="focus-ring w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-[15px] text-slate-800 placeholder:text-slate-400 transition-colors"
          aria-describedby="goal-error"
          aria-invalid="false"
        />

        <!-- Error state: border color + icon + text, not text alone (fixes P2 trust gap) -->
        <p id="goal-error" class="hidden mt-2 flex items-center gap-1.5 text-red-600 text-sm" role="alert" aria-live="assertive">
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 14h.01"/></svg>
          <span>Enter a project goal before generating steps.</span>
        </p>

        <!-- CTA: full-width on mobile, fixed comfortable width on sm+ (fixes P1 mobile crowding) -->
        <div class="mt-5 flex justify-end">
          <button
            id="generate-btn"
            type="submit"
            class="focus-ring inline-flex items-center gap-2 justify-center w-full sm:w-auto sm:min-w-[240px]
                   bg-indigo-600 text-white text-[15px] font-semibold px-6 sm:px-14 py-3 rounded-lg
                   hover:bg-indigo-700 hover:-translate-y-[1px] active:translate-y-0
                   disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0
                   transition-all duration-150"
          >
            <span id="btn-label">Generate next steps</span>
          </button>
        </div>
      </form>

      <!-- Single consolidated loading indicator (fixes P1 duplicate announcement) -->
      <div id="loading" class="hidden mt-4 flex items-center gap-2 text-slate-600 text-sm" role="status" aria-live="polite">
        <span>Generating next steps</span>
        <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
      </div>
    </section>

    <!-- OUTPUT ZONE -->
    <section class="mt-10" aria-labelledby="results-heading">
      <div class="flex items-center justify-between mb-4">
        <h2 id="results-heading" class="text-[12px] font-semibold uppercase tracking-[0.05em] text-slate-500">
          Your next three steps
        </h2>
        <span id="progress-counter" class="hidden text-[12px] font-medium text-slate-600"></span>
      </div>

      <p id="empty-state" class="text-slate-500 text-[15px] italic py-10 text-center border border-dashed border-slate-300 rounded-2xl">
        Your three steps will appear here.
      </p>

      <ul id="task-list" class="space-y-3 hidden"></ul>
    </section>
  </main>

<script>
  const form = document.getElementById('goal-form');
  const input = document.getElementById('goal-input');
  const errorMsg = document.getElementById('goal-error');
  const btn = document.getElementById('generate-btn');
  const btnLabel = document.getElementById('btn-label');
  const loading = document.getElementById('loading');
  const emptyState = document.getElementById('empty-state');
  const taskList = document.getElementById('task-list');
  const progressCounter = document.getElementById('progress-counter');

  // Small inline icon set reused for both task categories and metadata chips,
  // so meaning never depends on color alone (fixes P1 use-of-color risk).
  const ICONS = {
    flag:  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2v16M4 3h9l-2 3.5L13 10H4"/></svg>',
    sales: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10l3-6 3 4 3-5 5 7"/></svg>',
    cal:   '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>',
    wrench:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 14l-3 3 1.5 1.5L7.5 15M9 11l6-6a3 3 0 10-4-4l-6 6 4 4z"/></svg>',
    clock: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l3 2"/></svg>',
    tag:   '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10l7-7h5v5l-7 7-5-5z"/><circle cx="12.5" cy="7.5" r="0.9" fill="currentColor" stroke="none"/></svg>'
  };

  // Goal -> curated step-set matching. Avoids mail-merging the raw goal into
  // fixed sentence frames; falls back to a general plan when no keyword hits.
  const PLAYBOOKS = [
    {
      match: /\b(saas|app|product|micro.?saas|startup|launch|build)\b/i,
      steps: [
        { text: 'Pick one micro-idea that can ship in a weekend, like a Chrome extension or a Notion widget.', time: '~45 min', tag: 'Planning', icon: 'flag' },
        { text: 'List it on Gumroad or X with a $9–$29 price tag and a 2-minute demo video.', time: '~90 min', tag: 'Sales', icon: 'sales' },
        { text: 'Post the demo in three relevant communities with a direct purchase link.', time: '~30 min', tag: 'Marketing', icon: 'cal' }
      ]
    },
    {
      match: /\b(etsy|shop|store|sell|listing|storefront)\b/i,
      steps: [
        { text: 'Audit your five weakest listings and rewrite the titles around one high-intent keyword each.', time: '~40 min', tag: 'Research', icon: 'flag' },
        { text: 'Create one new mockup set for your best seller using a lifestyle scene, not a flat png.', time: '~50 min', tag: 'Design', icon: 'wrench' },
        { text: 'Schedule three social posts that link straight to your top listing this week.', time: '~25 min', tag: 'Marketing', icon: 'cal' }
      ]
    },
    {
      match: /\b(job|interview|resume|career|hire|offer|application)\b/i,
      steps: [
        { text: 'Rewrite your resume summary to lead with one measurable outcome from your last role.', time: '~30 min', tag: 'Prep', icon: 'flag' },
        { text: 'Draft answers to three likely behavioral questions using a specific past example each.', time: '~40 min', tag: 'Prep', icon: 'wrench' },
        { text: 'Send one follow-up or networking message to a contact at the target company.', time: '~15 min', tag: 'Outreach', icon: 'sales' }
      ]
    },
    {
      match: /\b(video|tiktok|reel|content|youtube|podcast)\b/i,
      steps: [
        { text: 'Script one 60-second hook that states the problem in the first 3 seconds.', time: '~25 min', tag: 'Planning', icon: 'flag' },
        { text: 'Record two takes on your phone, then trim to the tightest 45 seconds.', time: '~35 min', tag: 'Production', icon: 'wrench' },
        { text: 'Post it with three targeted hashtags and a comment prompting a reply.', time: '~10 min', tag: 'Marketing', icon: 'cal' }
      ]
    },
    {
      match: /\b(learn|study|course|skill|practice)\b/i,
      steps: [
        { text: 'Pick the single sub-skill that unblocks the most progress and write it down.', time: '~15 min', tag: 'Planning', icon: 'flag' },
        { text: 'Find one worked example or tutorial and rebuild it from scratch without copying.', time: '~60 min', tag: 'Practice', icon: 'wrench' },
        { text: 'Block a 30-minute recurring session on your calendar for the next three days.', time: '~5 min', tag: 'Scheduling', icon: 'cal' }
      ]
    }
  ];

  const DEFAULT_PLAYBOOK = [
    { text: 'Narrow the goal to one measurable outcome you could hit this week.', time: '~20 min', tag: 'Planning', icon: 'flag' },
    { text: 'Identify the one resource, tool, or person you are missing to start.', time: '~20 min', tag: 'Research', icon: 'wrench' },
    { text: 'Block 30 focused minutes on your calendar to take the first concrete action.', time: '~5 min', tag: 'Scheduling', icon: 'cal' }
  ];

  function buildTasks(goal) {
    const found = PLAYBOOKS.find(p => p.match.test(goal));
    return (found ? found.steps : DEFAULT_PLAYBOOK);
  }

  function updateProgress() {
    const total = taskList.querySelectorAll('.task-check').length;
    const done = taskList.querySelectorAll('.task-check.checked').length;
    progressCounter.textContent = `${done}/${total} completed`;
  }

  // Renders exactly three cards. Each checkbox toggles independently and
  // keeps aria-checked in sync so assistive tech reflects real state.
  function renderTasks(steps) {
    taskList.innerHTML = ''; // clear previous run so no stale checkboxes/state persist
    steps.forEach((step, i) => {
      const li = document.createElement('li');
      li.className = 'stagger-in card-hover flex items-start gap-4 bg-white border border-slate-200 border-l-4 border-l-indigo-500 rounded-xl p-4 sm:p-5';
      li.style.animationDelay = `${i * 100}ms`;

      li.innerHTML = `
        <button type="button" class="task-check" role="checkbox" aria-checked="false" aria-label="Mark step ${i + 1} complete">
          <svg viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2"><path d="M3 8.5l3.5 3.5L13 4"/></svg>
        </button>
        <div class="flex-1">
          <div class="flex items-start gap-2">
            <span class="text-indigo-500 mt-0.5 w-5 h-5 flex-shrink-0">${ICONS[step.icon]}</span>
            <p class="step-text text-[15px] sm:text-base text-slate-700 leading-relaxed">${step.text}</p>
          </div>
          <div class="mt-3 flex gap-2 pl-7">
            <span class="inline-flex items-center gap-1 text-[11px] font-medium bg-slate-100 text-slate-600 px-2 py-1 rounded-full">
              <span class="w-3 h-3">${ICONS.clock}</span>${step.time}
            </span>
            <span class="inline-flex items-center gap-1 text-[11px] font-medium bg-indigo-50 text-indigo-700 px-2 py-1 rounded-full">
              <span class="w-3 h-3">${ICONS.tag}</span>${step.tag}
            </span>
          </div>
        </div>
      `;

      const checkBtn = li.querySelector('.task-check');
      const stepText = li.querySelector('.step-text');
      checkBtn.addEventListener('click', () => {
        const isChecked = checkBtn.classList.toggle('checked');
        checkBtn.setAttribute('aria-checked', String(isChecked));
        stepText.classList.toggle('line-through', isChecked);
        stepText.classList.toggle('opacity-60', isChecked);
        updateProgress();
      });

      taskList.appendChild(li);
    });
    updateProgress();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const goal = input.value.trim();

    if (!goal) {
      errorMsg.classList.remove('hidden');
      input.classList.add('border-red-400');
      input.setAttribute('aria-invalid', 'true');
      input.focus();
      return;
    }

    errorMsg.classList.add('hidden');
    input.classList.remove('border-red-400');
    input.setAttribute('aria-invalid', 'false');

    btn.disabled = true;
    input.disabled = true;
    btnLabel.textContent = 'Generating…';
    loading.classList.remove('hidden');
    emptyState.classList.add('hidden');
    taskList.classList.add('hidden');
    progressCounter.classList.add('hidden');

    // Simulated generation, client-side only, ~800ms, no external API call
    setTimeout(() => {
      const steps = buildTasks(goal);
      renderTasks(steps);

      loading.classList.add('hidden');
      taskList.classList.remove('hidden');
      progressCounter.classList.remove('hidden');
      btn.disabled = false;
      input.disabled = false;
      btnLabel.textContent = 'Generate next steps';
    }, 800);
  });
</script>
</body>
</html>
